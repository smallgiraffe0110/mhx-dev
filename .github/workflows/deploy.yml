name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # master is production (Pages branch "main"); any other branch gets a
          # preview at <branch>.mhx-dev.pages.dev
          command: pages deploy out --project-name=mhx-dev --branch=${{ github.ref_name == 'master' && 'main' || github.ref_name }}
